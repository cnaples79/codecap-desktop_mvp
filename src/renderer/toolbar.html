<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
      width: 100vw;
      font-family: 'Segoe UI', sans-serif;
      color: #e0e0e0;
      background-color: #181818;
    }
    .sidebar {
      width: 60px;
      background-color: #20232a;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 12px;
      box-shadow: 2px 0 4px rgba(0,0,0,0.4);
      -webkit-app-region: no-drag; /* keep buttons clickable */
    }
    .sidebar button {
      width: 40px;
      height: 40px;
      margin-bottom: 12px;
      border: none;
      border-radius: 6px;
      background-color: transparent;
      color: #9fb3c8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      -webkit-app-region: no-drag;
      position: relative;
    }
    .sidebar button svg {
      transition: transform 0.2s ease;
    }
    .sidebar button:hover {
      background-color: #2e333b;
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .sidebar button:hover svg {
      transform: scale(1.1);
    }
    .sidebar button.active {
      background-color: var(--accent, #2e78c7);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(var(--accent-rgb, 46, 120, 199), 0.3);
    }
    .sidebar button:active {
      transform: translateY(0);
    }
    /* Collapsed mode: hide content pane */
    body.collapsed #content {
      display: none;
    }
    #content {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
    }
    /* Draggable title bar */
    #titlebar {
      height: 28px;
      margin: -12px -12px 8px -12px; /* stretch to full width inside content */
      padding: 0 8px;
      display: flex;
      align-items: center;
      background-color: #20232a;
      border-bottom: 1px solid #2e333b;
      color: #9fb3c8;
      font-size: 12px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag; /* allow window dragging */
    }
    #window-title {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    #window-controls {
      display: flex;
      gap: 6px;
      -webkit-app-region: no-drag;
    }
    #window-controls button {
      width: 20px;
      height: 20px;
      border: none;
      border-radius: 3px;
      background-color: #2e333b;
      color: #cbd5e1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      line-height: 1;
      padding: 0;
    }
    #window-controls button:hover {
      background-color: #3a3f47;
      color: #ffffff;
    }
    /* Codes list styles */
    #codes-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    #codes-list li {
      background-color: #282c34;
      margin-bottom: 8px;
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
      position: relative;
      padding-right: 56px; /* space for action buttons */
    }
    /* While editing, reclaim right padding and hide actions */
    #codes-list li.editing { padding-right: 8px; }
    #codes-list li.editing .snippet-actions { display: none; }
    #codes-list li:hover {
      background-color: #3a3f47;
    }
    #codes-list h4 {
      margin: 0 0 4px 0;
      font-size: 14px;
      color: #ffffff;
    }
    #codes-list p {
      margin: 0;
      font-size: 12px;
      color: #c0c0c0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Expanded code block */
    .code-block {
      display: none;
      background-color: #1f2329;
      color: #e6e6e6;
      padding: 8px;
      margin-top: 6px;
      border-radius: 4px;
      border: 1px solid #3a3f47;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 12px;
    }
    .code-block.visible {
      display: block;
    }
    /* Snippet action buttons */
    .snippet-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: none;
      gap: 6px;
    }
    #codes-list li:hover .snippet-actions {
      display: flex;
    }
    .action-btn {
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 3px;
      background-color: #2e333b;
      color: #cbd5e1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      line-height: 1;
      padding: 0;
    }
    .action-btn:hover {
      background-color: #3a3f47;
      color: #ffffff;
    }
    /* Search input */
    #search-bar {
      width: 100%;
      margin-bottom: 12px;
      padding: 6px 8px;
      border-radius: 4px;
      border: none;
      background-color: #2e333b;
      color: #ffffff;
      font-size: 14px;
    }
    #search-bar::placeholder {
      color: #777;
    }
    /* Panels */
    .panel {
      display: none;
    }
    .panel.active {
      display: block;
    }
    /* Settings styles */
    .settings-item {
      margin-bottom: 8px;
    }
    label {
      display: block;
      margin-bottom: 4px;
    }
    input[type="text"], select {
      width: 100%;
      padding: 6px 8px;
      border-radius: 4px;
      border: none;
      background-color: #2e333b;
      color: #ffffff;
    }
    textarea {
      width: 100%;
      padding: 6px 8px;
      border-radius: 4px;
      border: none;
      background-color: #2e333b;
      color: #ffffff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 12px;
    }
    .editor-container {
      margin-top: 8px;
      background-color: #1f2329;
      border: 1px solid #3a3f47;
      border-radius: 4px;
      padding: 8px;
    }
    .small-button {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      background-color: var(--accent, #2e78c7);
      color: #ffffff;
      font-size: 12px;
      border: none;
      cursor: pointer;
    }
    /* Light mode overrides (minimal) */
    body.light { color: #1f2937; background-color: #f5f6f8; }
    body.light .sidebar { background-color: #ffffff; box-shadow: 2px 0 4px rgba(0,0,0,0.1); }
    body.light .sidebar button { color: #475569; }
    body.light .sidebar button:hover { background-color: #e5e7eb; color: #111827; }
    body.light .sidebar button.active { background-color: var(--accent); color: #ffffff; }
    body.light #titlebar { background-color: #f3f4f6; border-bottom: 1px solid #e5e7eb; color: #475569; }
    body.light #window-controls button { background-color: #e5e7eb; color: #374151; }
    body.light #window-controls button:hover { background-color: #d1d5db; color: #111827; }
    body.light #codes-list li { background-color: #ffffff; }
    body.light #codes-list li:hover { background-color: #f3f4f6; }
    body.light .code-block { background-color: #f9fafb; color: #111827; border-color: #e5e7eb; }
    body.light input[type="text"], body.light select, body.light textarea { background-color: #f3f4f6; color: #111827; }
    /* Theme accents */
    :root { 
      --accent: #2e78c7; 
      --accent-rgb: 46, 120, 199;
    }
    body.theme-blue { 
      --accent: #2e78c7; 
      --accent-rgb: 46, 120, 199;
    }
    body.theme-green { 
      --accent: #2e8c57; 
      --accent-rgb: 46, 140, 87;
    }
    body.theme-purple { 
      --accent: #7a61d1; 
      --accent-rgb: 122, 97, 209;
    }
    body.theme-gray { 
      --accent: #6b7280; 
      --accent-rgb: 107, 114, 128;
    }
    /* Loading spinner */
    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: currentColor;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    /* AI result styling */
    .ai-section {
      margin-bottom: 8px;
    }
    .ai-section:last-child {
      margin-bottom: 0;
    }
    .ai-tag {
      display: inline-block;
      background: rgba(var(--accent-rgb), 0.2);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 12px;
      font-size: 10px;
      margin-right: 4px;
      margin-bottom: 2px;
      border: 1px solid rgba(var(--accent-rgb), 0.3);
    }
    .ai-results {
      color: #c0c0c0;
    }
    .ai-results strong {
      color: var(--accent);
    }
    /* Toasts */
    #toast-container {
      position: fixed;
      top: 44px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10000;
      pointer-events: none;
    }
    .toast {
      background: rgba(30, 32, 36, 0.95);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      backdrop-filter: blur(8px);
      font-size: 12px;
      pointer-events: auto;
      border-left: 3px solid var(--accent, #2e78c7);
      opacity: 0;
      transform: translateY(-6px) scale(0.95);
      animation: toast-in 200ms cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .toast.success { border-left-color: #10b981; }
    .toast.error { border-left-color: #ef4444; }
    .toast.warn { border-left-color: #f59e0b; }
    @keyframes toast-in {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes toast-out {
      to { opacity: 0; transform: translateY(-8px) scale(0.95); }
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <button id="btn-codes" title="View saved code snippets">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z" />
      </svg>
    </button>
    <button id="btn-cap" title="Capture screen region">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M9,2V7.38L10.38,6H14.62L16,7.38V2H9M7.38,8L2,13.38V17.62L3.38,19H8V13.38L7.38,8M13.38,8L12,9.38V15.62L13.38,17H17.62L19,15.62V9.38L17.62,8H13.38M8,21V15.62L6.62,17H2.38L1,15.62V21H8M10,15.62V21H15.62L17,19.62V15.62L15.62,14H10.38L10,15.62Z"/>
      </svg>
    </button>
    <button id="btn-ai" title="AI features and settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12,2A2,2 0 0,1 14,4C14,4.74 13.6,5.39 13,5.73V7H14A7,7 0 0,1 21,14H22A1,1 0 0,1 23,15V18A1,1 0 0,1 22,19H21V20A2,2 0 0,1 19,22H5A2,2 0 0,1 3,20V19H2A1,1 0 0,1 1,18V15A1,1 0 0,1 2,14H3A7,7 0 0,1 10,7H11V5.73C10.4,5.39 10,4.74 10,4A2,2 0 0,1 12,2M7.5,13A2.5,2.5 0 0,0 5,15.5A2.5,2.5 0 0,0 7.5,18A2.5,2.5 0 0,0 10,15.5A2.5,2.5 0 0,0 7.5,13M16.5,13A2.5,2.5 0 0,0 14,15.5A2.5,2.5 0 0,0 16.5,18A2.5,2.5 0 0,0 19,15.5A2.5,2.5 0 0,0 16.5,13Z"/>
      </svg>
    </button>
    <button id="btn-settings" title="Application settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.22,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.22,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.94C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.68 16.04,18.34 16.56,17.94L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z"/>
      </svg>
    </button>
    <button id="btn-share" title="Share and export snippets">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M21,12L14,5V9C7,10 4,15 3,20C5.5,16.5 9,14.9 14,14.9V19L21,12Z"/>
      </svg>
    </button>
  </div>
  <div id="content">
    <div id="titlebar">
      <div id="window-title">CodeCap</div>
      <div id="window-controls">
        <button id="win-min" title="Minimize">–</button>
        <button id="win-max" title="Maximize">▢</button>
        <button id="win-close" title="Close">✕</button>
      </div>
    </div>
    <div id="panel-codes" class="panel active">
      <input type="text" id="search-bar" placeholder="Search snippets" />
      <ul id="codes-list"></ul>
    </div>
    <div id="panel-ai" class="panel">
      <h3>AI Features</h3>
      <div class="settings-item">
        <label for="openrouter-key">OpenRouter API Key</label>
        <input type="password" id="openrouter-key" placeholder="Enter your OpenRouter API key" />
        <div style="margin-top:6px; display:flex; gap:8px; align-items:center;">
          <button id="save-openrouter-key" class="small-button">Save API Key</button>
          <small id="openrouter-status" style="opacity:0.8;"></small>
        </div>
        <small style="opacity:0.7; display:block; margin-top:4px;">Get a free API key from <a href="#" id="openrouter-link" style="color: var(--accent);">openrouter.ai</a></small>
      </div>
      <div class="settings-item">
        <label>AI Features</label>
        <div style="display:flex; flex-direction:column; gap:8px; margin-top:6px;">
          <label style="display:flex; align-items:center; gap:8px; font-size:14px;">
            <input type="checkbox" id="ai-enabled" checked /> Enable AI processing
          </label>
          <label style="display:flex; align-items:center; gap:8px; font-size:14px; margin-left:20px;">
            <input type="checkbox" id="ai-explain" checked /> Code explanation
          </label>
          <label style="display:flex; align-items:center; gap:8px; font-size:14px; margin-left:20px;">
            <input type="checkbox" id="ai-summarize" checked /> Text summarization
          </label>
          <label style="display:flex; align-items:center; gap:8px; font-size:14px; margin-left:20px;">
            <input type="checkbox" id="ai-tags" checked /> Smart tag suggestions
          </label>
        </div>
      </div>
      <div class="settings-item">
        <label for="ai-model">AI Model</label>
        <select id="ai-model">
          <option value="moonshotai/kimi-k2:free" selected>Kimi K2 (Free) - Recommended</option>
          <option value="deepseek/deepseek-r1-0528:free">DeepSeek R1 (Free)</option>
          <option value="openai/gpt-3.5-turbo">GPT-3.5 Turbo</option>
          <option value="anthropic/claude-3-haiku">Claude 3 Haiku</option>
        </select>
      </div>
      <div class="settings-item">
        <button id="save-ai-settings" class="small-button">Save AI Settings</button>
      </div>
      <div class="settings-item" id="ai-status-section" style="display:none;">
        <div style="padding:8px; background:rgba(var(--accent-rgb), 0.1); border-radius:4px; border-left:3px solid var(--accent);">
          <small id="ai-usage-status" style="opacity:0.9;">Ready to process snippets with AI</small>
        </div>
      </div>
    </div>
    <div id="panel-settings" class="panel">
      <h3>Settings</h3>
      <div class="settings-item">
        <label for="hotkey-input">Capture hotkey (read only)</label>
        <input type="text" id="hotkey-input" value="Ctrl/Cmd+Shift+2" readonly />
      </div>
      <div class="settings-item">
        <label for="mode-select">Appearance</label>
        <select id="mode-select">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
      <div class="settings-item">
        <label for="theme-select">Theme color</label>
        <select id="theme-select">
          <option value="blue">Blue</option>
          <option value="green">Green</option>
          <option value="purple">Purple</option>
          <option value="gray">Gray</option>
        </select>
      </div>
      <div class="settings-item">
        <label for="ocr-languages">OCR languages (comma-separated)</label>
        <input type="text" id="ocr-languages" value="eng" />
      </div>
      <div class="settings-item">
        <button id="save-settings" class="small-button">Save Settings</button>
      </div>
      <div class="settings-item">
        <button id="btn-export-snippets" class="small-button">Export Snippets</button>
      </div>
      <div class="settings-item">
        <label for="github-token">GitHub Token (gist scope)</label>
        <input type="text" id="github-token" placeholder="Paste token (not shown again)" />
        <div style="margin-top:6px; display:flex; gap:8px; align-items:center;">
          <button id="save-github-token" class="small-button">Save GitHub Token</button>
          <small id="github-status" style="opacity:0.8;"></small>
        </div>
      </div>
    </div>
    <div id="panel-share" class="panel">
      <h3>Share</h3>
      <div class="settings-item">
        <label for="share-search">Filter snippets</label>
        <input type="text" id="share-search" placeholder="Search by title or text" />
      </div>
      <div class="settings-item">
        <label><input type="checkbox" id="share-select-all" /> Select all</label>
        <ul id="share-list" style="list-style:none; padding:0; margin:8px 0; max-height:180px; overflow:auto;"></ul>
      </div>
      <div class="settings-item">
        <label>Format</label>
        <div style="display:flex; flex-wrap:wrap; gap:8px;">
          <label><input type="radio" name="share-format" value="markdown" checked /> Markdown</label>
          <label><input type="radio" name="share-format" value="plain" /> Plain</label>
          <label><input type="radio" name="share-format" value="code" /> Code</label>
          <label><input type="radio" name="share-format" value="json" /> JSON</label>
        </div>
        <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; align-items:center;">
          <label><input type="checkbox" id="share-include-title" checked /> Include title</label>
          <label><input type="checkbox" id="share-include-meta" /> Include metadata</label>
          <label><input type="checkbox" id="share-combine" checked /> Combine into single file</label>
          <label>Language
            <select id="share-language">
              <option value="auto" selected>Auto</option>
              <option>javascript</option>
              <option>typescript</option>
              <option>python</option>
              <option>go</option>
              <option>ruby</option>
              <option>java</option>
              <option>csharp</option>
              <option>cpp</option>
              <option>c</option>
              <option>rust</option>
              <option>php</option>
              <option>swift</option>
              <option>kotlin</option>
              <option>bash</option>
              <option>html</option>
              <option>css</option>
              <option>json</option>
              <option>yaml</option>
              <option>text</option>
            </select>
          </label>
        </div>
      </div>
      <div class="settings-item">
        <label>Destinations</label>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button id="share-clipboard" class="small-button">Copy to Clipboard</button>
          <button id="share-file" class="small-button">Save to File</button>
          <button id="share-email" class="small-button">Email</button>
          <button id="share-gist" class="small-button">Create GitHub Gist</button>
        </div>
        <div style="margin-top:8px; display:flex; gap:8px; align-items:center;">
          <label><input type="checkbox" id="gist-public" /> Public gist</label>
          <input type="text" id="gist-desc" placeholder="Gist description (optional)" />
          <small id="gist-status" style="opacity:0.8;"></small>
        </div>
      </div>
    </div>
  </div>
  <div id="toast-container"></div>
  <script src="toolbar.js"></script>
</body>
</html>
